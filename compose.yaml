
services:
  postgres:
    image: postgres:17-alpine
    container_name: enterpriseflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: enterpriseflow
      POSTGRES_USER: enterpriseflow
      POSTGRES_PASSWORD: local_only_change_me

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterpriseflow -d enterpriseflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
