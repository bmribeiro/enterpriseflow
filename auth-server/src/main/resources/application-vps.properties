# EnterpriseFlow - VPS privada por tunel SSH

# Issuer OIDC visivel ao navegador Windows
spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

# Frontend acessivel por tunel SSH
spring.security.oauth2.authorizationserver.client.projects.registration.redirect-uris[0]=http://localhost:14200/auth/callback

# Origem CORS do Frontend remoto
app.cors.allowed-origins=http://localhost:14200