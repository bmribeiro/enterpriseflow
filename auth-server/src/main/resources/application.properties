
# ==========================================
# EnterpriseFlow - Authorization Server
# ==========================================

spring.application.name=enterpriseflow-auth-server
server.port=9000

# ==========================================
# Demo user - local development only
# ==========================================

spring.security.user.name=demo
spring.security.user.password=${AUTH_DEMO_PASSWORD}
spring.security.user.roles=USER

# ==========================================
# OAuth2 / OIDC
# ==========================================

spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

# ==========================================
# OAuth2 Client A - Angular Projects
# ==========================================

spring.security.oauth2.authorizationserver.client.projects.registration.client-id=enterpriseflow-projects
spring.security.oauth2.authorizationserver.client.projects.registration.client-authentication-methods[0]=none
spring.security.oauth2.authorizationserver.client.projects.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.projects.registration.redirect-uris[0]=http://localhost:4200/auth/callback
spring.security.oauth2.authorizationserver.client.projects.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.projects.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.projects.registration.scopes[2]=projects.read
spring.security.oauth2.authorizationserver.client.projects.registration.scopes[3]=projects.write
spring.security.oauth2.authorizationserver.client.projects.require-proof-key=true

# ==========================================
# OAuth2 Client B - Angular Admin
# ==========================================

spring.security.oauth2.authorizationserver.client.admin.registration.client-id=enterpriseflow-admin
spring.security.oauth2.authorizationserver.client.admin.registration.client-authentication-methods[0]=none
spring.security.oauth2.authorizationserver.client.admin.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.admin.registration.redirect-uris[0]=http://localhost:4300/auth/callback
spring.security.oauth2.authorizationserver.client.admin.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.admin.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.admin.require-proof-key=true

