# EnterpriseFlow - Backend VPS privada

# O issuer deve corresponder ao campo iss dos tokens
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# Endpoint interno do Authorization Server no Kubernetes
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI}

# A ligacao PostgreSQL sera configurada por variaveis de ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
