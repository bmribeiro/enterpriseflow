# ==========================================
# ENTERPRISEFLOW - Application Configuration
# ==========================================

# Application
spring.application.name=enterpriseflow-backend

# Server
server.port=8080

# ==========================================
# PostgreSQL - DataSource
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5433/enterpriseflow
spring.datasource.username=${DB_USERNAME:enterpriseflow}
spring.datasource.password=${DB_PASSWORD:local_only_change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Spring Boot Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ==========================================
# Flyway - Database Migrations
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true


# ==========================================
# OAuth2 Resource Server - JWT
# ==========================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# API audience validation
spring.security.oauth2.resourceserver.jwt.audiences[0]=enterpriseflow-api

