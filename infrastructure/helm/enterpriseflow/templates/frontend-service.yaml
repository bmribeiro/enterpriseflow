apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterpriseflow.fullname" . }}-frontend
  labels:
    {{- include "enterpriseflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: enterpriseflow-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP