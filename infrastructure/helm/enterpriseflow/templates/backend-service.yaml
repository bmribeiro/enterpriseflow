apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterpriseflow.fullname" . }}-backend
  labels:
    {{- include "enterpriseflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: enterpriseflow-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8080
      protocol: TCP