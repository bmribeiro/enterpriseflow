name: EnterpriseFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: enterpriseflow
          POSTGRES_USER: enterpriseflow
          POSTGRES_PASSWORD: enterpriseflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U enterpriseflow -d enterpriseflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/enterpriseflow
      SPRING_DATASOURCE_USERNAME: enterpriseflow
      SPRING_DATASOURCE_PASSWORD: enterpriseflow

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and Test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  auth-server:
    name: Auth Server - Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: auth-server/pom.xml

      - name: Build and Test
        working-directory: auth-server
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend - Angular 22
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Tests
        working-directory: frontend
        run: npm test -- --watch=false
