name: EnterpriseFlow Publish GHCR

on:
  workflow_run:
    workflows: ["EnterpriseFlow CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.component.name }}
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            context: ./backend
          - name: auth-server
            context: ./auth-server
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bmribeiro/enterpriseflow-${{ matrix.component.name }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/bmribeiro/enterpriseflow
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
